name: iOS Build

on:
  push:
    paths:
      - 'native/ios/**'
      - 'native/cpp/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'native/ios/**'
      - 'native/cpp/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build C++ Engine Static Library (iOS Simulator)
        run: |
          SIM_SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          HOST_ARCH="$(uname -m)"
          mkdir -p native/cpp/build-ios-sim native/ios/Lexicon/Engine/lib
          for src in native/cpp/src/*.cpp; do
            extra_def=""
            if [ "$(basename "${src}")" = "hash_table.cpp" ]; then
              extra_def="-DLEXICON_UNICODE_EXTERNAL"
            fi
            obj="native/cpp/build-ios-sim/$(basename "${src%.cpp}").o"
            xcrun --sdk iphonesimulator clang++ \
              -target "${HOST_ARCH}-apple-ios16.0-simulator" \
              -isysroot "${SIM_SDK}" \
              -std=c++17 -O2 -fPIC ${extra_def} \
              -I native/cpp/include \
              -c "${src}" -o "${obj}"
          done
          xcrun --sdk iphonesimulator libtool -static -o native/ios/Lexicon/Engine/lib/liblexicon-engine.a native/cpp/build-ios-sim/*.o
          cp -r native/cpp/include/lexicon native/ios/Lexicon/Engine/lib/
          ls -lh native/ios/Lexicon/Engine/lib/liblexicon-engine.a

      - name: Build iOS App (Simulator, Unsigned)
        working-directory: native/ios
        run: |
          HOST_ARCH="$(uname -m)"
          xcodebuild \
            -project Lexicon.xcodeproj \
            -scheme Lexicon \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            ARCHS="${HOST_ARCH}" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_LDFLAGS='$(inherited) -llexicon-engine -lsqlite3 -lc++ -L$(SRCROOT)/Lexicon/Engine/lib' \
            HEADER_SEARCH_PATHS='$(inherited) $(SRCROOT)/Lexicon $(SRCROOT)/Lexicon/Engine $(SRCROOT)/Lexicon/Engine/lib $(SRCROOT)/../cpp/include' \
            build

      - name: Boot iOS Simulator & Capture Native Light + Dark Screenshots
        run: bash native/ios/capture-screenshots.sh

      - name: Upload iOS Native Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-screenshots
          path: ${{ runner.temp }}/ios-screenshots/*.png
          if-no-files-found: error

      - name: Upload iOS Simulator App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: lexicon-ios-simulator-app
          path: ${{ runner.temp }}/Lexicon-iOS-Simulator.app.zip
          if-no-files-found: error
