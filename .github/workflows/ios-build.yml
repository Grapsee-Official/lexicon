name: iOS Build

on:
  push:
    paths:
      - 'native/ios/**'
      - 'native/kmm/**'
      - 'native/cpp/**'
  pull_request:
    paths:
      - 'native/ios/**'
      - 'native/kmm/**'
      - 'native/cpp/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build C++ Engine as static library for iOS
        run: |
          cd native/cpp
          mkdir build-ios && cd build-ios
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DTARGET_IOS=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF
          make -j$(nproc)
          # Create a fat library location that Xcode can find
          mkdir -p ../../ios/Lexicon/Engine/lib
          cp liblexicon-engine.a ../../ios/Lexicon/Engine/lib/liblexicon-engine.a
          # Copy headers
          cp -r ../include/lexicon ../../ios/Lexicon/Engine/lib/
          echo "Static library built and copied"

      - name: List Xcode schemes
        run: |
          cd native/ios
          xcodebuild -project Lexicon.xcodeproj -list

      - name: Build iOS App (with C++ linked)
        run: |
          cd native/ios
          xcodebuild \
            -project Lexicon.xcodeproj \
            -scheme Lexicon \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            OTHER_LDFLAGS='$(inherited) -llexicon-engine -L$(SRCROOT)/Lexicon/Engine/lib' \
            HEADER_SEARCH_PATHS='$(inherited) $(SRCROOT)/Lexicon/Engine/lib $(SRCROOT)/../cpp/include' \
            build 2>&1

      - name: Build KMM iOS target
        run: |
          cd native/kmm
          ./gradlew compileKotlinIosArm64 --no-daemon
        continue-on-error: true
