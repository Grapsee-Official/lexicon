name: Lexicon Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-test-apk.yml'
      - 'native/android/app/src/main/java/com/lexicon/ui/components/Hero.kt'
      - 'native/android/app/src/main/java/com/lexicon/ui/components/WordOfTheDayCard.kt'
      - 'native/android/app/src/main/java/com/lexicon/ui/components/CategoryCard.kt'
      - 'native/android/app/src/main/res/drawable-nodpi/hero_dark.png'
      - 'scripts/install_moonlit_home_hero.py'
permissions:
  contents: write
concurrency:
  group: lexicon-android-test-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify original moonlit artwork in both native platforms
        run: python3 scripts/install_moonlit_home_hero.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'
      - name: Assemble test APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify packaged moonlit hero
        run: python3 scripts/install_moonlit_home_hero.py --check --apk native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish separate test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp native/android/app/build/outputs/apk/debug/app-debug.apk dist/lexicon-android-test.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify dist/lexicon-android-test.apk
          TAG="android-test-${GITHUB_SHA:0:12}"
          NOTES="Debug APK for testing commit $GITHUB_SHA. Uses a separate debug application ID. Includes the original moonlit countryside artwork, with trailing overscan, page-integrated foreground and reference-aligned hero spacing. Source assets and APK dimensions verified. Not a stable release."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/lexicon-android-test.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/lexicon-android-test.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Lexicon Android test (${GITHUB_SHA:0:7})" --notes "$NOTES" --prerelease --latest=false
          fi
