name: Lexicon Native Visual QA
# QA builds stay private to Actions artifacts. Never publish a release APK here.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-visual-qa.yml'
      - 'native/**'
      - 'scripts/check_countryside_art.py'
      - 'scripts/check_capture_quality.py'
      - 'scripts/test_capture_quality.py'
      - 'scripts/build_native_contact_sheets.py'
      - 'scripts/check_editable_botanical_svg.py'
      - 'scripts/check_bundled_fonts.py'
      - 'scripts/check_home_bookplate_geometry.py'
      - 'scripts/check_native_material_parity.py'
      - 'scripts/check_template_paper_alpha.py'
      - 'scripts/check_screen_diversity.py'
      - 'scripts/capture_android_adaptive.sh'
      - 'scripts/capture_android_screens.sh'
      - 'artwork/vector/countryside-*-material.svg'
      - 'artwork/vector/lexora-*.svg'
      - 'docs/visual-qa/lexora-home-reference-contract.md'
  workflow_dispatch:
  # Autonomous debug-only visual QA; scheduling can be delayed by GitHub.
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: lexicon-visual-qa
  # Collapse rapid commits into a single verification of the newest main.
  cancel-in-progress: true

jobs:
  cpp-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run C++17 engine tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libsqlite3-dev libgtest-dev
          cmake -S native/cpp -B native/cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DTARGET_ANDROID=OFF -DTARGET_IOS=OFF
          cmake --build native/cpp/build --parallel 3
          ctest --test-dir native/cpp/build --output-on-failure

  android-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Validate countryside imagery and editable botanicals
        run: |
          python3 scripts/check_countryside_art.py
          python3 scripts/check_editable_botanical_svg.py
          python3 scripts/check_bundled_fonts.py
          python3 scripts/check_native_material_parity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'
      - name: Compile and test internal debug app (never published)
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Allow KVM acceleration on GitHub-hosted Linux
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || true
      - name: Install Android screenshot verifier before capture
        run: |
          python3 -m venv "$RUNNER_TEMP/lexicon-qa-venv"
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" -m pip install --disable-pip-version-check "Pillow==11.3.0"
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/test_capture_quality.py
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/check_template_paper_alpha.py
      - name: Capture actual Android emulator screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: google_apis
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096 -cores 2
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash scripts/capture_android_screens.sh && bash scripts/capture_android_adaptive.sh
      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p qa-captures/android-diagnostics
          adb devices -l > qa-captures/android-diagnostics/devices.txt || true
          timeout 15 adb logcat -d -t 1000 > qa-captures/android-diagnostics/logcat.txt 2>&1 || true
          free -m > qa-captures/android-diagnostics/memory.txt
          df -h > qa-captures/android-diagnostics/disk.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexicon-android-emulator-diagnostics
          path: qa-captures/android-diagnostics/*
          retention-days: 7
      - name: Reject blank or missing Android visual evidence
        run: |
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/check_capture_quality.py qa-captures/android --expected-count 30
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/check_home_bookplate_geometry.py qa-captures/android/light-home.png
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/check_screen_diversity.py qa-captures/android
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/check_capture_quality.py qa-captures/android-adaptive/compact --expected-count 26
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/check_capture_quality.py qa-captures/android-adaptive/tablet --expected-count 26
      - name: Prepare Android visual review galleries (including partial captures)
        if: always()
        run: |
          if [ ! -x "$RUNNER_TEMP/lexicon-qa-venv/bin/python" ]; then echo "No capture verifier was installed"; exit 0; fi
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/build_native_contact_sheets.py qa-captures/android qa-captures/android-review --platform android
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/build_native_contact_sheets.py qa-captures/android-adaptive/compact qa-captures/android-adaptive/compact-review --platform android
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/build_native_contact_sheets.py qa-captures/android-adaptive/tablet qa-captures/android-adaptive/tablet-review --platform android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexicon-android-30-screen-evidence
          path: qa-captures/android/*.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexora-android-visual-review
          path: qa-captures/android-review/*.jpg
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexora-android-compact-tablet-evidence
          path: qa-captures/android-adaptive/**/*.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexora-android-adaptive-review
          path: qa-captures/android-adaptive/*-review/*.jpg
          if-no-files-found: warn
          retention-days: 7

  ios-screens:
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Validate countryside imagery and editable botanicals
        run: |
          python3 scripts/check_countryside_art.py
          python3 scripts/check_editable_botanical_svg.py
          python3 scripts/check_bundled_fonts.py
          python3 scripts/check_native_material_parity.py
      - name: Build C++17 for Apple simulator
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          ARCH="$(uname -m)"
          mkdir -p native/cpp/build-ios-sim native/ios/Lexicon/Engine/lib
          for src in native/cpp/src/*.cpp; do
            def=""
            if [ "$(basename "$src")" = "hash_table.cpp" ]; then def="-DLEXICON_UNICODE_EXTERNAL"; fi
            obj="native/cpp/build-ios-sim/$(basename "${src%.cpp}").o"
            xcrun --sdk iphonesimulator clang++ -target "${ARCH}-apple-ios16.0-simulator" -isysroot "$SDK" -std=c++17 -O2 -fPIC ${def} -I native/cpp/include -c "$src" -o "$obj"
          done
          xcrun --sdk iphonesimulator libtool -static -o native/ios/Lexicon/Engine/lib/liblexicon-engine.a native/cpp/build-ios-sim/*.o
          cp -r native/cpp/include/lexicon native/ios/Lexicon/Engine/lib/
      - name: Compile actual native iOS simulator app
        working-directory: native/ios
        run: |
          ARCH="$(uname -m)"
          xcodebuild -project Lexicon.xcodeproj -scheme Lexicon -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath "${RUNNER_TEMP}/DerivedData" ARCHS="$ARCH" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" OTHER_LDFLAGS='$(inherited) -llexicon-engine -lsqlite3 -lc++ -L$(SRCROOT)/Lexicon/Engine/lib' HEADER_SEARCH_PATHS='$(inherited) $(SRCROOT)/Lexicon $(SRCROOT)/Lexicon/Engine $(SRCROOT)/Lexicon/Engine/lib $(SRCROOT)/../cpp/include' build
      - name: Install native screenshot verifier
        run: |
          python3 -m venv "$RUNNER_TEMP/lexicon-qa-venv"
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" -m pip install --disable-pip-version-check "Pillow==11.3.0"
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/test_capture_quality.py
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/check_template_paper_alpha.py
      - name: Boot a simulator and capture 30 actual SwiftUI screens
        run: |
          set -eu
          APP="${RUNNER_TEMP}/DerivedData/Build/Products/Debug-iphonesimulator/Lexicon.app"
          test -d "$APP"
          mkdir -p qa-captures/ios
          xcrun simctl list devices available --json > "${RUNNER_TEMP}/lexicon-devices.json"
          DEVICE=$(python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); ds=[d for arr in x["devices"].values() for d in arr if d.get("isAvailable") and "iPhone" in d["name"]]; print(ds[0]["udid"] if ds else "")' "${RUNNER_TEMP}/lexicon-devices.json")
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" "$APP"
          # A booted simulator can still fail to foreground a newly launched
          # process: the screenshot is pure white, with only system chrome.
          # If two fresh app launches do not paint, reset that simulator once.
          # Never accept a blank frame or bypass the 30-screen quality gate.
          recover_white_simulator() {
            echo "::warning::iOS $mode/$screen has no visible app frame; rebooting the simulator before a final capture attempt"
            xcrun simctl terminate "$DEVICE" com.lexicon.app >/dev/null 2>&1 || true
            xcrun simctl shutdown "$DEVICE" || true
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            xcrun simctl install "$DEVICE" "$APP"
          }
          # Each screen gets a fresh app launch. This avoids a stuck SwiftUI
          # snapshot-sync task disguising a navigation regression as a PNG.
          serial=0
          for mode in light dark; do
            for screen in home dictionary_home word_of_the_day word_detail collections my_notes study_lists quick_templates search_discovery search_results expanded_exploration more translations library library_article; do
              serial=$((serial+1))
              valid=0
              for launch_attempt in 1 2 3; do
                if [ "$launch_attempt" -eq 3 ]; then recover_white_simulator; fi
                xcrun simctl terminate "$DEVICE" com.lexicon.app >/dev/null 2>&1 || true
                xcrun simctl launch "$DEVICE" com.lexicon.app \
                  -lexoraTheme "$mode" -lexiconScreen "$screen" -lexoraVisualQa 1
                sleep 3
                for attempt in 1 2 3 4; do
                  sleep 2
                  xcrun simctl io "$DEVICE" screenshot "qa-captures/ios/$mode-$screen.png"
                  if "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/check_capture_quality.py "qa-captures/ios/$mode-$screen.png"; then
                    valid=1
                    break
                  fi
                  echo "::warning::iOS $mode/$screen blank on launch $launch_attempt, capture $attempt"
                done
                if [ "$valid" = 1 ]; then break; fi
                echo "::warning::Relaunching the iOS screen after persistent blank frames"
              done
              if [ "$valid" != 1 ]; then
                echo "::error::iOS $mode/$screen remained blank after 2 fresh launches"
                xcrun simctl spawn "$DEVICE" log show --last 20s \
                  --style compact --predicate 'process == "Lexicon"' \
                  | tail -90 || true
                exit 1
              fi
              echo "CAPTURE $serial: native iOS $mode/$screen"
            done
          done
          test "$(find qa-captures/ios -type f -name '*.png' | wc -l)" -eq 30
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/check_capture_quality.py qa-captures/ios --expected-count 30
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/check_home_bookplate_geometry.py qa-captures/ios/light-home.png
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/check_screen_diversity.py qa-captures/ios
          find qa-captures/ios -type f -name '*.png' | sort
      - name: Prepare iOS visual review galleries (including partial captures)
        if: always()
        run: |
          if [ ! -x "$RUNNER_TEMP/lexicon-qa-venv/bin/python" ]; then echo "No capture verifier was installed"; exit 0; fi
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/build_native_contact_sheets.py qa-captures/ios qa-captures/ios-review --platform ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexora-ios-visual-review
          path: qa-captures/ios-review/*.jpg
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve native iOS crash reports for failed captures
        if: always()
        run: |
          mkdir -p qa-captures/ios-diagnostics
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -iname '*Lexicon*.ips' -o -iname '*Lexicon*.crash' \) -exec cp {} qa-captures/ios-diagnostics/ \; || true
          find qa-captures/ios-diagnostics -type f || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexicon-ios-crash-diagnostics
          path: qa-captures/ios-diagnostics/*
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexicon-ios-30-screen-evidence
          path: qa-captures/ios/*.png
          if-no-files-found: warn
          retention-days: 7
