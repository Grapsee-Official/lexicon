name: Lexicon Native Visual QA
# QA builds stay private to Actions artifacts. Never publish a release APK here.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-visual-qa.yml'
      - 'native/**'
      - 'scripts/check_countryside_art.py'
      - 'scripts/check_capture_quality.py'
      - 'scripts/build_native_contact_sheets.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lexicon-visual-qa
  cancel-in-progress: false

jobs:
  cpp-engine:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual-qa]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run C++17 engine tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libsqlite3-dev libgtest-dev
          cmake -S native/cpp -B native/cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DTARGET_ANDROID=OFF -DTARGET_IOS=OFF
          cmake --build native/cpp/build --parallel 3
          ctest --test-dir native/cpp/build --output-on-failure

  android-screens:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual-qa]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify all countryside assets
        run: python3 scripts/check_countryside_art.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'
      - name: Compile and test internal debug app (never published)
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Allow KVM acceleration on GitHub-hosted Linux
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || true
      - name: Capture actual Android emulator screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: google_apis
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash scripts/capture_android_screens.sh
      - name: Reject blank or missing Android visual evidence
        run: |
          python3 -m venv "$RUNNER_TEMP/lexicon-qa-venv"
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" -m pip install --disable-pip-version-check "Pillow==11.3.0"
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/check_capture_quality.py qa-captures/android --expected-count 26
      - name: Prepare Android visual review galleries
        run: |
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/build_native_contact_sheets.py qa-captures/android qa-captures/android-review --platform android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexicon-android-26-screen-evidence
          path: qa-captures/android/*.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexora-android-visual-review
          path: qa-captures/android-review/*.jpg
          if-no-files-found: warn
          retention-days: 7

  ios-screens:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual-qa]')
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_countryside_art.py
      - name: Build C++17 for Apple simulator
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          ARCH="$(uname -m)"
          mkdir -p native/cpp/build-ios-sim native/ios/Lexicon/Engine/lib
          for src in native/cpp/src/*.cpp; do
            def=""
            if [ "$(basename "$src")" = "hash_table.cpp" ]; then def="-DLEXICON_UNICODE_EXTERNAL"; fi
            obj="native/cpp/build-ios-sim/$(basename "${src%.cpp}").o"
            xcrun --sdk iphonesimulator clang++ -target "${ARCH}-apple-ios16.0-simulator" -isysroot "$SDK" -std=c++17 -O2 -fPIC ${def} -I native/cpp/include -c "$src" -o "$obj"
          done
          xcrun --sdk iphonesimulator libtool -static -o native/ios/Lexicon/Engine/lib/liblexicon-engine.a native/cpp/build-ios-sim/*.o
          cp -r native/cpp/include/lexicon native/ios/Lexicon/Engine/lib/
      - name: Compile actual native iOS simulator app
        working-directory: native/ios
        run: |
          ARCH="$(uname -m)"
          xcodebuild -project Lexicon.xcodeproj -scheme Lexicon -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath "${RUNNER_TEMP}/DerivedData" ARCHS="$ARCH" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" OTHER_LDFLAGS='$(inherited) -llexicon-engine -lsqlite3 -lc++ -L$(SRCROOT)/Lexicon/Engine/lib' HEADER_SEARCH_PATHS='$(inherited) $(SRCROOT)/Lexicon $(SRCROOT)/Lexicon/Engine $(SRCROOT)/Lexicon/Engine/lib $(SRCROOT)/../cpp/include' build
      - name: Install native screenshot verifier
        run: |
          python3 -m venv "$RUNNER_TEMP/lexicon-qa-venv"
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Boot a simulator and capture 26 actual SwiftUI screens
        run: |
          set -eu
          APP="${RUNNER_TEMP}/DerivedData/Build/Products/Debug-iphonesimulator/Lexicon.app"
          test -d "$APP"
          mkdir -p qa-captures/ios
          xcrun simctl list devices available --json > "${RUNNER_TEMP}/lexicon-devices.json"
          DEVICE=$(python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); ds=[d for arr in x["devices"].values() for d in arr if d.get("isAvailable") and "iPhone" in d["name"]]; print(ds[0]["udid"] if ds else "")' "${RUNNER_TEMP}/lexicon-devices.json")
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" "$APP"
          # The in-app snapshot channel confirms the screen is actually active.
          # Keep one SwiftUI app process instead of repeatedly launching SpringBoard.
          DATA_DIR="$(xcrun simctl get_app_container "$DEVICE" com.lexicon.app data)"
          SYNC_DIR="$DATA_DIR/lexicon-qa-sync"
          mkdir -p "$SYNC_DIR"
          rm -f "$SYNC_DIR/req.txt" "$SYNC_DIR/ack.txt"
          xcrun simctl launch "$DEVICE" com.lexicon.app \
            -lexoraTheme light -lexiconScreen home \
            -lexiconSnapshotSyncDir "$SYNC_DIR"
          sleep 4
          serial=0
          for mode in light dark; do
            for screen in home dictionary_home word_of_the_day word_detail collections my_notes study_lists quick_templates search_discovery search_results expanded_exploration more translations; do
              serial=$((serial+1))
              printf '%s|%s|%s\n' "$serial" "$mode" "$screen" > "$SYNC_DIR/req.txt"
              ready=0
              for tick in $(seq 1 110); do
                if [ -f "$SYNC_DIR/ack.txt" ] && [ "$(cat "$SYNC_DIR/ack.txt")" = "$serial" ]; then
                  ready=1
                  break
                fi
                sleep 0.3
              done
              if [ "$ready" != 1 ]; then
                echo "::error::iOS simulator failed to acknowledge screen $mode/$screen"
                xcrun simctl spawn "$DEVICE" log show --last 20s \
                  --style compact --predicate 'process == "Lexicon"' \
                  | tail -90 || true
                exit 1
              fi
              # SwiftUI transitions can briefly expose the system's white backing
              # window. Verify actual rendered content, not merely ACK/PNG size.
              valid=0
              for attempt in 1 2 3 4; do
                sleep 1
                xcrun simctl io "$DEVICE" screenshot "qa-captures/ios/$mode-$screen.png"
                if "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/check_capture_quality.py "qa-captures/ios/$mode-$screen.png"; then
                  valid=1
                  break
                fi
                echo "::warning::iOS $mode/$screen blank at attempt $attempt; retrying"
              done
              if [ "$valid" != 1 ]; then
                echo "::error::iOS $mode/$screen remained blank after 4 captures"
                exit 1
              fi
              echo "ACK $serial: native iOS $mode/$screen (verified)"
            done
          done
          test "$(find qa-captures/ios -type f -name '*.png' | wc -l)" -eq 26
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/check_capture_quality.py qa-captures/ios --expected-count 26
          find qa-captures/ios -type f -name '*.png' | sort
      - name: Prepare iOS visual review galleries
        run: |
          "$RUNNER_TEMP/lexicon-qa-venv/bin/python" scripts/build_native_contact_sheets.py qa-captures/ios qa-captures/ios-review --platform ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexora-ios-visual-review
          path: qa-captures/ios-review/*.jpg
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve native iOS crash reports for failed captures
        if: always()
        run: |
          mkdir -p qa-captures/ios-diagnostics
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -iname '*Lexicon*.ips' -o -iname '*Lexicon*.crash' \) -exec cp {} qa-captures/ios-diagnostics/ \; || true
          find qa-captures/ios-diagnostics -type f || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexicon-ios-crash-diagnostics
          path: qa-captures/ios-diagnostics/*
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexicon-ios-26-screen-evidence
          path: qa-captures/ios/*.png
          if-no-files-found: warn
          retention-days: 7
