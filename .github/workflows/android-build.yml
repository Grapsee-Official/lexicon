name: Android Build

on:
  push:
    paths:
      - 'native/android/**'
      - 'native/kmm/**'
      - 'native/cpp/**'
  pull_request:
    paths:
      - 'native/android/**'
      - 'native/kmm/**'
      - 'native/cpp/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.3.11579264 cmake;3.22.1'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}

      - name: Build Android App
        run: |
          cd native/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        continue-on-error: true

      - name: Upload APK if built
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lexicon-debug-apk
          path: native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
