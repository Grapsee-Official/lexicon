name: Lexicon Native Release
# One-off owner-requested Android-only signed release from the release branch.
# Ordinary UI/design commits and PR builds never publish this release.
on:
  workflow_dispatch:
  push:
    branches: [release/lexicon-1.0.3]
    paths:
      - '.github/workflows/android-build.yml'
permissions:
  contents: write
concurrency:
  group: lexicon-native-release
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_countryside_art.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'
      - name: Test and assemble Android release without debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lexicon-unsigned-release-candidate
          path: native/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [build-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lexicon-unsigned-release-candidate
          path: release-candidate
      - name: Validate stable release signing credentials
        env:
          LEXICON_RELEASE_KEYSTORE_BASE64: ${{ secrets.LEXICON_RELEASE_KEYSTORE_BASE64 }}
          LEXICON_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.LEXICON_RELEASE_KEYSTORE_PASSWORD }}
          LEXICON_RELEASE_KEY_ALIAS: ${{ secrets.LEXICON_RELEASE_KEY_ALIAS }}
          LEXICON_RELEASE_KEY_PASSWORD: ${{ secrets.LEXICON_RELEASE_KEY_PASSWORD }}
        run: |
          for key in LEXICON_RELEASE_KEYSTORE_BASE64 LEXICON_RELEASE_KEYSTORE_PASSWORD LEXICON_RELEASE_KEY_ALIAS LEXICON_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing $key. Stable signing is required before APK publication."; exit 1; fi
          done
          printf '%s' "$LEXICON_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lexicon-release.jks"
          chmod 600 "$RUNNER_TEMP/lexicon-release.jks"
      - name: Sign, verify and update the single GitHub Release without release notes
        env:
          LEXICON_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.LEXICON_RELEASE_KEYSTORE_PASSWORD }}
          LEXICON_RELEASE_KEY_ALIAS: ${{ secrets.LEXICON_RELEASE_KEY_ALIAS }}
          LEXICON_RELEASE_KEY_PASSWORD: ${{ secrets.LEXICON_RELEASE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p dist
          "$TOOLS/zipalign" -f -p 4 release-candidate/app-release-unsigned.apk dist/lexicon-aligned.apk
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/lexicon-release.jks" --ks-key-alias "$LEXICON_RELEASE_KEY_ALIAS" --ks-pass env:LEXICON_RELEASE_KEYSTORE_PASSWORD --key-pass env:LEXICON_RELEASE_KEY_PASSWORD --out dist/lexicon-android-release.apk dist/lexicon-aligned.apk
          "$TOOLS/apksigner" verify --verbose dist/lexicon-android-release.apk
          TAG=lexicon-latest
          cat > dist/RELEASE_NOTES.md <<'EOF'
          ## Lexicon for Android — 1.0.3

          Native Android release APK for English-countryside Lexicon. Signed with the project's existing stable release certificate.

          ### Native countryside journal
          - Rebuilds the Word of the Day and Word Detail pages with naturally sized, complete landscape watercolors and readable manuscript text.
          - Rebalances Etymology and usage examples; the botanical illustration is no longer trapped inside a fixed-height card.
          - Matches illustrated bookplates and fact panels to the artwork's source ratio, including increased text sizes.
          - Adds a deeper Search dawn/night landscape using original editable SVG underpaintings and matching native vector rendering.
          - Adds a functional Reading Journey subpage backed by real saved words and recent searches.
          - Makes Search filter cards responsive, fixes definition/example filtering, shows real translation counts, and removes hard-coded search history.
          - Preserves the existing stable C++ dictionary engine, original watercolor artwork and local-first data storage.

          ### Verification
          - Android release build and unit tests performed in GitHub Actions.
          - C++ engine tests passed in the repository's existing test workflow.
          - Device-specific visual parity and every subpage interaction require ongoing real-device verification; neither is certified as pixel-perfect.

          Build source: the `release/lexicon-1.0.3` branch. Do not confuse this APK with the previous release APK.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Keep release source/tag aligned with the exact APK build commit,
            # even while the source-fidelity PR remains in review.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload "$TAG" dist/lexicon-android-release.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Lexicon Android 1.0.3" --notes-file dist/RELEASE_NOTES.md --latest
          else
            gh release create "$TAG" dist/lexicon-android-release.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Lexicon Android 1.0.3" --notes-file dist/RELEASE_NOTES.md --latest
          fi
