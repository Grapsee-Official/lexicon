name: C++ Engine Build & Test

on:
  push:
    paths:
      - 'native/cpp/**'
      - '.github/workflows/cpp-engine.yml'
  pull_request:
    paths:
      - 'native/cpp/**'
      - '.github/workflows/cpp-engine.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev libgtest-dev

      - name: Build Google Test static libs if needed
        run: |
          if [ -d /usr/src/gtest ] && [ ! -f /usr/lib/x86_64-linux-gnu/libgtest.a ] && [ ! -f /usr/lib/libgtest.a ]; then
            sudo cmake -S /usr/src/gtest -B /tmp/gtest-build
            sudo cmake --build /tmp/gtest-build -j"$(nproc)"
            sudo cp /tmp/gtest-build/lib/*.a /usr/local/lib/ || sudo cp /tmp/gtest-build/*.a /usr/local/lib/ || true
          fi

      - name: Configure CMake
        run: |
          cmake -S "${GITHUB_WORKSPACE}/native/cpp" -B "${GITHUB_WORKSPACE}/native/cpp/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DTARGET_ANDROID=OFF \
            -DTARGET_IOS=OFF

      - name: Build
        run: |
          cmake --build "${GITHUB_WORKSPACE}/native/cpp/build" --parallel "$(nproc)"

      - name: Run tests
        run: |
          ctest --test-dir "${GITHUB_WORKSPACE}/native/cpp/build" --output-on-failure --parallel 1
